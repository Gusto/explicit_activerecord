services:
  app:
    build:
      context: ../
      dockerfile: Dockerfile.test
      secrets:
        - cloudsmith_api_key
    environment:
      BUILDKITE:
      BUILDKITE_AGENT_ACCESS_TOKEN:
      BUILDKITE_BRANCH:
      BUILDKITE_BUILD_ID:
      BUILDKITE_BUILD_NUMBER:
      BUILDKITE_BUILD_URL:
      BUILDKITE_COMMAND:
      BUILDKITE_COMMIT:
      BUILDKITE_JOB_ID:
      BUILDKITE_PIPELINE_SLUG:
      BUILDKITE_REPO:
      CLOUDSMITH_API_KEY:
secrets:
  cloudsmith_api_key:
    environment: CLOUDSMITH_API_KEY
